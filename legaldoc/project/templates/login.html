{% extends 'base.html' %}{% block title %}Login{% endblock %}{% block content %}<div class="card form-card"><h1>Login</h1><div id="message"></div><form id="form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn">Login</button></form><p>New user? <a href="/register">Create an account</a></p></div><script>form.onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});location.href='/dashboard'}catch(e){showError(e)}}</script>{% endblock %}
