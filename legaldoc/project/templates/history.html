{% extends 'base.html' %}{% block title %}History{% endblock %}{% block content %}<div class="card"><h1>Recommendation History</h1><div id="message"></div><div id="history"></div></div><script>async function load(){try{const r=await api('/api/history');history.innerHTML=r.length?r.map(x=>`<div class="item"><b>${x.planner.toUpperCase()}</b> · ${money(x.budget)}<p class="muted">${new Date(x.created_at).toLocaleString()}</p><p>${x.response.summary}</p></div>`).join(''):'<p>No recommendations yet.</p>'}catch(e){showError(e)}}load()</script>{% endblock %}
