{% extends 'base.html' %}{% block title %}Party Planner{% endblock %}{% block content %}<div class="card form-card"><h1>Party Budget Planner</h1><div id="message"></div><form id="planner"><label>Total Budget (₹)</label><input id="budget" type="number" min="1" required><label>Guests</label><input id="guests" type="number" min="1" required><label>Event Type</label><select id="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Family Function</option></select><label>Venue</label><input id="venue" value="Flexible"><label>City</label><input id="city" value="Chennai"><button class="btn">Plan My Party</button></form><div id="result" class="result"></div></div><script>planner.onsubmit=async e=>{e.preventDefault();try{renderResult(await api('/api/generate-party',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({budget:+budget.value,guests:+guests.value,event_type:event_type.value,venue:venue.value,city:city.value})}))}catch(e){showError(e)}}</script>{% endblock %}
