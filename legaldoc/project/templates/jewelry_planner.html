{% extends 'base.html' %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<div class="card form-card"><h1>Jewelry Budget Planner</h1><div id="message"></div><form id="planner" enctype="multipart/form-data"><label>Budget (₹)</label><input id="budget" name="budget" type="number" min="1" required><label>Occasion</label><input id="occasion" name="occasion" placeholder="Wedding / Birthday / Festival" required><label>Style</label><select id="style" name="style"><option>Elegant</option><option>Traditional</option><option>Minimalist</option><option>Statement</option></select><label>Outfit Description</label><textarea id="outfit_description" name="outfit_description"></textarea><label>Optional Outfit Image</label><input id="outfit_image" name="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn">Generate Jewelry Ideas</button></form><div id="result" class="result"></div></div><script>planner.onsubmit=async e=>{e.preventDefault();try{renderResult(await api('/api/generate-jewelry',{method:'POST',body:new FormData(planner)}))}catch(e){showError(e)}}</script>{% endblock %}
