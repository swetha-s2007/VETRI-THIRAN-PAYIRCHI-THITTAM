{% extends 'base.html' %}{% block title %}Home Planner{% endblock %}{% block content %}<div class="card form-card"><h1>Home Interior Budget Planner</h1><div id="message"></div><form id="planner"><label>Total Budget (₹)</label><input id="budget" type="number" min="1" required><label>Room Type</label><select id="room_type"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option></select><label>Style</label><select id="style"><option>Modern</option><option>Minimalist</option><option>Traditional</option><option>Bohemian</option></select><label>Items (comma separated)</label><input id="items" placeholder="ceiling fan, light, rug, table"><button class="btn">Generate Recommendations</button></form><div id="result" class="result"></div></div><script>planner.onsubmit=async e=>{e.preventDefault();try{renderResult(await api('/api/generate-home',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({budget:+budget.value,room_type:room_type.value,style:style.value,items:items.value.split(',').map(x=>x.trim()).filter(Boolean)})}))}catch(e){showError(e)}}</script>{% endblock %}
